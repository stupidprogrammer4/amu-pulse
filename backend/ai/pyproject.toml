[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amu-ai"
version = "0.1.0"
description = "Retrieval, signal, and model-training services for AMU Pulse"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Pouya", email = "captainjoker757@gmail.com" }
]
dependencies = [
    "fastapi==0.136.0",
    "uvicorn[standard]==0.38.0",
    "pydantic==2.12.5",
    "PyYAML==6.0.3",
    "orjson==3.11.5",
    "SQLAlchemy==2.0.49",
    "asyncpg==0.31.0",
    "pgvector==0.5.0",
    "alembic==1.18.4",
    "redis==7.1.0",
    "taskiq==0.12.1",
    "taskiq-redis==1.2.1",
    "ollama==0.6.2",
    "httpx==0.28.1",
    "colorlog==6.10.1",
]

[project.optional-dependencies]
# heavy and only needed to run training/ — deliberately out of the image
training = [
    "torch",
    "transformers",
    "datasets",
    "peft",
    "accelerate",
]
dev = [
    "pytest==9.0.1",
    "pytest-asyncio==1.3.0",
    "anyio==4.13.0",
    "ruff",
    "pyright==1.1.390",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUntypedFunctionDecorator = "error"
reportUnnecessaryTypeIgnoreComment = "warning"
reportImplicitOverride = "none"

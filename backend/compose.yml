name: amu-pulse

x-core: &core
  image: amu-pulse-core:local
  build:
    context: .
    dockerfile: core/Dockerfile
  init: true
  environment:
    FASTAMU_POSTGRESQL__DSN: >-
      postgresql+asyncpg://postgres@postgres:5432/core_pulse_db
    FASTAMU_REDIS__URL: "redis://redis:6379/0"
    FASTAMU_TASKIQ__REDIS_URL: "redis://redis:6379/0"
    FASTAMU_ES__HOSTS: '["http://elasticsearch:9200"]'
  volumes:
    - ./core/config.yml:/app/config.yml:ro
    - media-data:/app/media

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: core_pulse_db
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d core_pulse_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS
          'http://localhost:9200/_cluster/health?wait_for_status=yellow'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrate:
    <<: *core
    profiles: ["tools"]
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *core
    profiles: ["tools"]
    restart: "no"
    command: ["python", "-m", "src.seeders"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    <<: *core
    restart: unless-stopped
    command:
      [
        "uvicorn",
        "src.web.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/system/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  worker:
    <<: *core
    restart: unless-stopped
    command:
      [
        "taskiq",
        "worker",
        "src.tasks.broker:broker",
        "--workers",
        "${TASKIQ_WORKERS:-2}",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  scheduler:
    <<: *core
    restart: unless-stopped
    command: ["taskiq", "scheduler", "src.tasks.scheduler:scheduler"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  elasticsearch-data:
  media-data:

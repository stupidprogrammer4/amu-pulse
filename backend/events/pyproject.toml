[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amu-events"
version = "0.1.0"
description = "The RabbitMQ event contract shared by the api and ai apps"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Pouya", email = "captainjoker757@gmail.com" }
]
dependencies = [
    "pydantic==2.12.5",
    "taskiq==0.12.1",
    "taskiq-aio-pika==0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.1",
    "pytest-asyncio==1.3.0",
    "anyio==4.13.0",
    "ruff",
    "pyright==1.1.390",
]

[tool.hatch.build.targets.wheel]
packages = ["src/events"]

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["events"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

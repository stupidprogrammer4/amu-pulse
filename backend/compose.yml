name: amu-pulse

x-api: &api
  image: amu-pulse-api:local
  build:
    context: .
    dockerfile: api/Dockerfile
  init: true
  volumes:
    - ./api/config.docker.yml:/app/config.yml:ro
    - media-data:/app/media

x-ai: &ai
  image: amu-pulse-ai:local
  build:
    context: .
    dockerfile: ai/Dockerfile
  init: true
  volumes:
    - ./ai/config.docker.yml:/app/config.yml:ro
    - ai-artifacts:/app/artifacts

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: core_pulse_db
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d core_pulse_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-ai:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_pulse_db
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_AI_PORT:-5433}:5432"
    volumes:
      - postgres-ai-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_pulse_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS
          'http://localhost:9200/_cluster/health?wait_for_status=yellow'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrate:
    <<: *api
    profiles: ["tools"]
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *api
    profiles: ["tools"]
    restart: "no"
    command: ["python", "-m", "src.seeders"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    <<: *api
    restart: unless-stopped
    command:
      [
        "uvicorn",
        "src.web.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/system/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  worker:
    <<: *api
    restart: unless-stopped
    command:
      [
        "taskiq",
        "worker",
        "src.tasks.broker:broker",
        "--workers",
        "${TASKIQ_WORKERS:-2}",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  scheduler:
    <<: *api
    restart: unless-stopped
    command: ["taskiq", "scheduler", "src.tasks.scheduler:scheduler"]
    depends_on:
      redis:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.32.5
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ai-migrate:
    <<: *ai
    profiles: ["tools"]
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres-ai:
        condition: service_healthy

  ai-api:
    <<: *ai
    restart: unless-stopped
    command:
      [
        "uvicorn",
        "src.api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8100",
      ]
    ports:
      - "${AI_API_PORT:-8100}:8100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8100/system/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      postgres-ai:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy

  ai-worker:
    <<: *ai
    restart: unless-stopped
    command:
      [
        "taskiq",
        "worker",
        "src.workers.broker:broker",
        "--workers",
        "${AI_TASKIQ_WORKERS:-2}",
      ]
    depends_on:
      postgres-ai:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  postgres-data:
  postgres-ai-data:
  redis-data:
  elasticsearch-data:
  media-data:
  ollama-data:
  ai-artifacts:

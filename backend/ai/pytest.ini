[pytest]
# Async-first: every `async def` test/fixture runs without an explicit marker
# (pytest-asyncio), matching how the app is written.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

testpaths = tests
pythonpath = .
addopts = -ra -q --strict-markers

markers =
    unit: fast, isolated; no external services
    integration: requires the real test database or a live Ollama
